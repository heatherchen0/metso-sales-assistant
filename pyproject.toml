[project]
name = "metso-sales-assistant"
version = "0.1.0"
description = "Source-grounded sales assistant with local corpus preparation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pdfplumber==0.11.10",
  "pypdfium2==5.14.0",
  "pillow==12.3.0",
]

[project.optional-dependencies]
docling = [
  "docling-slim[convert-core,format-pdf,models-local]==2.138.0",
  "opencv-python-headless>=4.10,<5",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
